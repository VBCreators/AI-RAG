[project]
name = "AI-RAG"
version = "0.1.0"
description = "AI-RAG System"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "bandit>=1.9.4",
    "fastapi[standard]>=0.141.1",
    "mypy>=2.3.1",
    "pip-audit>=2.10.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "semgrep>=1.173.0",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
ai-rag = "ai_rag:main"          # ← fixed

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.fastapi]
entrypoint = "ai_rag.main:app"
