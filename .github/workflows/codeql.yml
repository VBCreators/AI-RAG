# .github/workflows/codeql.yml
#
# Production-grade GitHub CodeQL Static Application Security Testing (SAST)
# Performs semantic dataflow and taint-tracking analysis on Python code.
#
# Permissions rationale:
# - contents: read       -> Clone and parse repository source code
# - security-events: write -> Upload SARIF analysis results to GitHub Security Tab
# - actions: read        -> Required for CodeQL analysis on private repositories

name: CodeQL

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
    types:
      - opened
      - synchronize
      - reopened
  schedule:
    - cron: '23 4 * * 1' # Weekly Monday 04:23 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL SAST Analysis (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: python
          queries: security-extended

      - name: Autobuild CodeQL
        uses: github/codeql-action/autobuild@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: /language:python
