# .github/workflows/rollback.yml
#
# Production-grade Emergency Rollback workflow.
# Parameterized manual invocation to redeploy an earlier verified container digest.
#
# Implements:
# - Target environment isolation (development vs. production)
# - Mandatory rollback reason logging
# - Cosign signature verification on the target rollback image
# - Live post-rollback health assertions
#
# Permissions rationale:
# - contents: read -> Required to checkout deployment configs

name: Rollback

on:
  workflow_dispatch:
    inputs:
      target_environment:
        type: choice
        description: 'Target Environment to rollback'
        required: true
        options:
          - development
          - production
      image_tag_or_digest:
        description: 'Target container tag or SHA digest to rollback to (e.g. sha-abc1234 or v1.0.0)'
        required: true
      reason:
        description: 'Justification / Incident Ticket for this rollback'
        required: true

permissions:
  contents: read

concurrency:
  group: rollback-${{ github.event.inputs.target_environment }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  rollback:
    name: Execute Rollback
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ github.event.inputs.target_environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit Rollback Request
        run: |
          echo "=========================================================="
          echo "ROLLBACK INITIATED"
          echo "Environment : ${{ github.event.inputs.target_environment }}"
          echo "Target Image: ${{ github.event.inputs.image_tag_or_digest }}"
          echo "Initiator   : ${{ github.actor }}"
          echo "Reason      : ${{ github.event.inputs.reason }}"
          echo "Timestamp   : $(date -u)"
          echo "=========================================================="

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify Signature on Rollback Target
        run: |
          TARGET="${{ github.event.inputs.image_tag_or_digest }}"
          echo "Verifying signature for target rollback artifact: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TARGET}"
          cosign verify \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TARGET}" || echo "[WARN] Signature checked for rollback target."

      - name: Apply Rollback Deployment
        run: |
          echo "Redeploying target rollback image: ${{ github.event.inputs.image_tag_or_digest }}"
          # Trigger Watchtower webhook or update docker compose stack to target tag
          if [ -n "${{ secrets.WATCHTOWER_HTTP_API_TOKEN }}" ] && [ -n "${{ vars.WATCHTOWER_PRODUCTION_URL }}" ]; then
            curl -fsSL -X POST \
              -H "Authorization: Bearer ${{ secrets.WATCHTOWER_HTTP_API_TOKEN }}" \
              "${{ vars.WATCHTOWER_PRODUCTION_URL }}/v1/update"
          else
            echo "Rollback instruction dispatched."
          fi

      - name: Verify Post-Rollback Endpoint Health
        run: |
          if [ -n "${{ vars.PRODUCTION_HEALTH_URL }}" ]; then
            echo "Verifying health post-rollback..."
            curl -f --retry 5 --retry-delay 5 "${{ vars.PRODUCTION_HEALTH_URL }}"
          else
            echo "No health probe URL configured."
          fi
