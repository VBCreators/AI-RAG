# .github/workflows/security.yml
#
# Production-grade Security & SAST workflow implementing:
# - Secret leak detection (Gitleaks + TruffleHog)
# - Python Static Application Security Testing (Bandit AST + Semgrep)
# - Dependency vulnerability scanning (Google OSV-Scanner + pip-audit)
# - Dockerfile security & best-practices linting (Hadolint)
# - GitHub Actions workflow security auditing (zizmor)
# - Filesystem vulnerability & misconfiguration scanning (Trivy FS)
# - Supply-chain security health assessment (OpenSSF Scorecard)

name: Security

on:
  push:
    branches:
      - main
      - dev
      - 'feature/**'
      - 'bugfix/**'
      - 'hotfix/**'
      - 'refactor/**'
      - 'chore/**'
  pull_request:
    branches:
      - main
      - dev
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  schedule:
    - cron: '0 3 * * 1' # Weekly Monday 03:00 UTC
  workflow_dispatch:

# Least-privilege top-level permission default.
permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # =========================================================================
  # 1. Secret & Credential Leak Detection
  # =========================================================================
  secret-detection:
    name: Secret Detection (Gitleaks + TruffleHog)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan Repository for Secrets (Gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'

      - name: Scan Repository for Secrets (TruffleHog)
        uses: trufflesecurity/trufflehog@bcfcf73aaf4759d4dadc2783177c245a02792318 # v3.97.0
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

  # =========================================================================
  # 2. Python SAST (Bandit + Semgrep)
  # =========================================================================
  python-sast:
    name: Python SAST (Bandit + Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Run Bandit AST Security Scan
        run: |
          pip install --upgrade pip bandit[toml]
          if [ -f pyproject.toml ]; then
            bandit -r . -c pyproject.toml -x ./.git,./.venv,./venv,./tests -ll || bandit -r . -x ./.git,./.venv,./venv,./tests -ll
          else
            bandit -r . -x ./.git,./.venv,./venv,./tests -ll
          fi

      - name: Run Semgrep SAST Rules
        uses: semgrep/semgrep-action@9a16a63fd4f29af4f7f64782b8890943de7788a6 # v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/owasp-top-ten
            p/python

  # =========================================================================
  # 3. Dependency Vulnerability Audits (OSV-Scanner + pip-audit)
  # =========================================================================
  dependency-vulnerability-scan:
    name: Dependency CVE Scan (OSV-Scanner + pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # Required if uploading SARIF findings
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Run Google OSV-Scanner
        uses: google/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --skip-git
            ./

      - name: Run pip-audit
        run: |
          pip install --upgrade pip pip-audit
          if [ -f requirements.txt ]; then
            pip-audit -r requirements.txt
          elif [ -f pyproject.toml ]; then
            pip-audit
          else
            echo "No requirements file or pyproject.toml found for pip-audit."
          fi

  # =========================================================================
  # 4. Dockerfile & Workflow Security (Hadolint + zizmor)
  # =========================================================================
  dockerfile-and-workflow-audit:
    name: Dockerfile & Workflow Security (Hadolint + zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint Dockerfile (Hadolint)
        if: ${{ hashFiles('Dockerfile', 'Dockerfile.*') != '' }}
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - name: Set up Python for zizmor
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Run zizmor Workflow Security Audit
        run: |
          pip install --upgrade pip zizmor
          zizmor . || echo "zizmor scan completed with warnings."

  # =========================================================================
  # 5. Filesystem & Misconfiguration Scan (Trivy FS)
  # =========================================================================
  filesystem-misconfig-scan:
    name: Filesystem & Misconfiguration Scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # Required for SARIF upload
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@1f0aa582c8c8f5f7639610d6d38baddfea4fdcee # v0.9.2
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Upload Trivy FS SARIF Report
        if: always()
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-filesystem

  # =========================================================================
  # 6. Supply Chain Security Health Assessment (OpenSSF Scorecard)
  # =========================================================================
  scorecard-analysis:
    name: Supply Chain Scorecard (OpenSSF)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # For uploading SARIF to code scanning tab
      id-token: write       # For authenticating with OpenSSF API
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard Analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload Scorecard SARIF Report
        if: always()
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: scorecard-results.sarif
          category: openssf-scorecard
