# .github/workflows/container.yml
#
#   Container workflow implementing:
# - Pre-flight Dockerfile sanity check (skip pipeline if Dockerfile is empty/comment-only)
# - Multi-stage Docker Buildx compilation with GHA layer caching
# - Dynamic semantic & SHA tag generation
# - Trivy container image layer vulnerability scanning
# - Grype second-opinion CVE scanning
# - Dockle CIS Docker Benchmark compliance check
# - SPDX Software Bill of Materials (SBOM) generation (Syft)
# - SLSA Build Provenance attestation (actions/attest-build-provenance)
# - Keyless cryptographic container signing (Sigstore Cosign via OIDC on main)
# - Safe delivery to GitHub Container Registry (GHCR) / Docker Hub
#
# Permissions rationale:
# - contents: read         -> Clone repository and build context
# - packages: write        -> Push compiled images to GHCR (dev/main only)
# - id-token: write        -> Generate Sigstore OIDC token for keyless Cosign signing
# - attestations: write    -> Publish SLSA build provenance attestations
# - security-events: write -> Upload Trivy/Grype SARIF findings to Security Tab

name: Container

on:
  push:
    branches:
      - main
      - dev
      - 'feature/**'
      - 'bugfix/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main
      - dev
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-scan-and-deliver:
    name: Build, Scan, Attest & Deliver Container
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # ---------------------------------------------------------------------
      # Pre-flight: Detect whether the Dockerfile is actually buildable.
      # Empty file, missing file, or comment/whitespace-only file -> skip.
      # ---------------------------------------------------------------------
      - name: Check if Dockerfile is buildable
        id: dockerfile_check
        shell: bash
        run: |
          set -e
          if [ ! -f "./Dockerfile" ]; then
            echo "is_buildable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Dockerfile is missing — skipping container pipeline."
            exit 0
          fi

          # Count non-empty lines that are not pure comments.
          content_lines=$(grep -vE '^\s*(#.*)?$' ./Dockerfile | wc -l | tr -d ' ')
          echo "Non-comment, non-blank lines: ${content_lines}"

          if [ "${content_lines}" -gt 0 ]; then
            echo "is_buildable=true" >> "$GITHUB_OUTPUT"
            echo "Dockerfile contains real build instructions — proceeding."
          else
            echo "is_buildable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Dockerfile is empty or contains only comments — skipping container pipeline."
          fi

      - name: Determine if Push is Authorized
        id: auth_check
        if: steps.dockerfile_check.outputs.is_buildable == 'true'
        run: |
          if [ "${{ github.event_name }}" = "push" ] && { [ "${{ github.ref }}" = "refs/heads/main" ] || [ "${{ github.ref }}" = "refs/heads/dev" ]; }; then
            echo "push_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "push_enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Docker Metadata & Tags
        id: meta
        if: steps.dockerfile_check.outputs.is_buildable == 'true'
        uses: docker/metadata-action@v6.2.0
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=semver,pattern={{version}}

      - name: Resolve primary image reference
        id: image_ref
        if: steps.dockerfile_check.outputs.is_buildable == 'true'
        shell: bash
        run: |
          # Take the first tag produced by docker/metadata-action.
          primary="$(echo "${{ steps.meta.outputs.tags }}" | head -n1 | tr -d '[:space:]')"
          echo "image_ref=${primary}" >> "$GITHUB_OUTPUT"
          echo "Using image reference: ${primary}"

      - name: Set up Docker Buildx
        if: steps.dockerfile_check.outputs.is_buildable == 'true'
        uses: docker/setup-buildx-action@v4.2.0

      - name: Log in to GitHub Container Registry (GHCR)
        if: steps.dockerfile_check.outputs.is_buildable == 'true' && steps.auth_check.outputs.push_enabled == 'true'
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub (Optional)
        if: steps.dockerfile_check.outputs.is_buildable == 'true' && steps.auth_check.outputs.push_enabled == 'true' && vars.PUSH_TO_DOCKERHUB == 'true'
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ---------------------------------------------------------------------
      # Build step.
      #
      # IMPORTANT: provenance + sbom with --load (load=true) triggers
      #   "docker exporter does not currently support exporting manifest lists"
      # because the docker exporter cannot write multi-arch manifest lists
      # into the local Docker daemon.
      #
      # Fix: only enable provenance/sbom when we're actually pushing (--push).
      # ---------------------------------------------------------------------
      - name: Build Application Container
        id: build_step
        if: steps.dockerfile_check.outputs.is_buildable == 'true'
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: ${{ steps.auth_check.outputs.push_enabled == 'true' }}
          load: ${{ steps.auth_check.outputs.push_enabled != 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: ${{ steps.auth_check.outputs.push_enabled == 'true' }}
          sbom: ${{ steps.auth_check.outputs.push_enabled == 'true' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Built Image with Trivy
        if: steps.dockerfile_check.outputs.is_buildable == 'true'
        id: trivy_scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image_ref.outputs.image_ref }}
          format: sarif
          output: trivy-container-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Upload Trivy Container SARIF Report
        if: always() && steps.dockerfile_check.outputs.is_buildable == 'true' && hashFiles('trivy-container-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4.37.8
        with:
          sarif_file: trivy-container-results.sarif
          category: trivy-container

      - name: Second-Opinion Vulnerability Scan (Grype)
        if: steps.dockerfile_check.outputs.is_buildable == 'true'
        continue-on-error: true
        uses: anchore/scan-action@v7.4.0
        with:
          image: ${{ steps.image_ref.outputs.image_ref }}
          fail-build: false
          output-format: table

      - name: CIS Docker Benchmark Compliance Check (Dockle)
        if: steps.dockerfile_check.outputs.is_buildable == 'true'
        continue-on-error: true
        uses: goodwithtech/dockle-action@v0.4.15
        with:
          image: ${{ steps.image_ref.outputs.image_ref }}
          failure-threshold: WARN
          accept-key: CIS-DI-0001,CIS-DI-0005,CIS-DI-0006

      - name: Generate Software Bill of Materials (SBOM via Syft)
        if: steps.dockerfile_check.outputs.is_buildable == 'true'
        continue-on-error: true
        uses: anchore/sbom-action@v0.9.0
        with:
          image: ${{ steps.image_ref.outputs.image_ref }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM Artifact
        if: always() && steps.dockerfile_check.outputs.is_buildable == 'true' && hashFiles('sbom.spdx.json') != ''
        uses: actions/upload-artifact@v7.0.1
        with:
          name: container-sbom-${{ github.sha }}
          path: sbom.spdx.json
          retention-days: 90

      - name: Attest SLSA Build Provenance
        if: steps.dockerfile_check.outputs.is_buildable == 'true' && steps.auth_check.outputs.push_enabled == 'true'
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build_step.outputs.digest }}
          push-to-registry: true

      - name: Install Cosign
        if: steps.dockerfile_check.outputs.is_buildable == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign Container Image (Keyless OIDC)
        if: steps.dockerfile_check.outputs.is_buildable == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cosign sign --yes "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build_step.outputs.digest }}"

      - name: Pipeline Skip Notice
        if: steps.dockerfile_check.outputs.is_buildable != 'true'
        run: |
          echo "::notice::Container pipeline was skipped because the Dockerfile is empty, missing, or contains only comments. This is expected at the initial stage of the project."
