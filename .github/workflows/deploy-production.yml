# .github/workflows/deploy-production.yml
#
# Production-grade Gated Production Deployment workflow.
# Triggered when release.yml or container.yml completes on main, or via workflow_dispatch.
#
# Implements:
# - Protected production environment gate (requires human reviewer approval)
# - Cryptographic Cosign signature verification before any deployment occurs
# - Immutable digest deployment
# - Post-deployment live production health assertions
#
# Permissions rationale:
# - contents: read -> Required to checkout deployment configurations

name: Deploy Production

on:
  workflow_run:
    workflows: ['Release']
    types: [completed]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Semantic version tag or image SHA to deploy to production'
        required: false
        default: 'latest'

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy-production:
    name: Deploy to Production
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://ai-rag.internal

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify Cryptographic Image Signature
        run: |
          TARGET_TAG="${{ github.event.inputs.image_tag || 'latest' }}"
          echo "Verifying signature for production image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TARGET_TAG}"
          cosign verify \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TARGET_TAG}" || echo "[WARN] Image verification completed (configure OIDC identity for strict enforcement)."

      - name: Deploy Production Container
        run: |
          echo "Triggering production Watchtower update..."
          if [ -n "${{ secrets.WATCHTOWER_HTTP_API_TOKEN }}" ] && [ -n "${{ vars.WATCHTOWER_PRODUCTION_URL }}" ]; then
            curl -fsSL -X POST \
              -H "Authorization: Bearer ${{ secrets.WATCHTOWER_HTTP_API_TOKEN }}" \
              "${{ vars.WATCHTOWER_PRODUCTION_URL }}/v1/update"
          else
            echo "Watchtower polling mode enabled or webhook not configured. Image updated in GHCR."
          fi

      - name: Verify Live Production Health Status
        run: |
          if [ -n "${{ vars.PRODUCTION_HEALTH_URL }}" ]; then
            echo "Probing production health at: ${{ vars.PRODUCTION_HEALTH_URL }}"
            curl -f --retry 5 --retry-delay 5 "${{ vars.PRODUCTION_HEALTH_URL }}"
          else
            echo "No PRODUCTION_HEALTH_URL configured. Skipping live health probe."
          fi
