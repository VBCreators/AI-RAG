# .github/workflows/release.yml
#
# Production-grade Release Automation workflow.
# Triggered when semantic tags (e.g. v1.0.0) are pushed to the repository,
# or manually via workflow_dispatch.
#
# Implements:
# - Automated changelog generation
# - SHA-256 checksum generation for release assets
# - Official GitHub Release publication
# - Attaching Software Bill of Materials (SBOM) to release assets
#
# Permissions rationale:
# - contents: write -> Required strictly to create GitHub Release and upload assets

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Semantic version tag (e.g., v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  create-release:
    name: Create & Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate Release Checksums
        run: |
          mkdir -p release-assets
          find . -maxdepth 2 -type f \( -name "*.whl" -o -name "*.tar.gz" -o -name "sbom*.json" \) -exec sha256sum {} + > release-assets/SHA256SUMS.txt || true
          if [ ! -s release-assets/SHA256SUMS.txt ]; then
            echo "No build packages found, creating release metadata." > release-assets/RELEASE_NOTES.txt
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.version_tag }}
          name: Release ${{ github.ref_name || github.event.inputs.version_tag }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            release-assets/*
