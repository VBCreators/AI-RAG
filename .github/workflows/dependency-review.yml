# .github/workflows/dependency-review.yml
#
# Supply-chain dependency review for Pull Requests.
# Evaluates newly introduced or updated dependencies against the GitHub
# Advisory Database and licenses before merging into protected branches.
#
# Permissions rationale:
# - contents: read -> Required to inspect PR diff and manifest changes

name: Dependency Review

on:
  pull_request:
    branches:
      - main
      - dev
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency Review & License Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Perform Dependency Review
        uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
