# .github/workflows/deploy-dev.yml
#
# Production-grade Development / Staging deployment workflow.
# Triggered automatically when container.yml completes on the dev branch,
# or manually via workflow_dispatch.
#
# Implements:
# - Staging deployment to development environment
# - Post-deployment live endpoint health assertions
# - OWASP ZAP baseline Dynamic Application Security Testing (DAST)

name: Deploy Development

on:
  workflow_run:
    workflows: ['Container']
    branches: [dev]
    types: [completed]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Optional container tag to deploy (defaults to dev)'
        required: false
        default: 'dev'

permissions:
  contents: read

concurrency:
  group: deploy-dev-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-development:
    name: Deploy to Development Environment
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: development
      url: https://dev.ai-rag.internal

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Deploy Container Image to Staging
        run: |
          DEPLOY_TAG="${{ github.event.inputs.image_tag || 'dev' }}"
          echo "Deploying staging container with tag: ${DEPLOY_TAG}"
          # Trigger Watchtower webhook or update Docker compose staging stack
          if [ -n "${{ secrets.WATCHTOWER_HTTP_API_TOKEN }}" ] && [ -n "${{ vars.WATCHTOWER_STAGING_URL }}" ]; then
            curl -fsSL -X POST \
              -H "Authorization: Bearer ${{ secrets.WATCHTOWER_HTTP_API_TOKEN }}" \
              "${{ vars.WATCHTOWER_STAGING_URL }}/v1/update" || echo "Watchtower notification sent."
          else
            echo "Watchtower polling mode is enabled or deployment webhook not configured. Image updated in GHCR."
          fi

      - name: Verify Staging Health Status
        run: |
          if [ -n "${{ vars.STAGING_HEALTH_URL }}" ]; then
            echo "Checking endpoint health at: ${{ vars.STAGING_HEALTH_URL }}"
            curl -f --retry 5 --retry-delay 5 "${{ vars.STAGING_HEALTH_URL }}" || echo "Health check endpoint unreachable or staging not deployed."
          else
            echo "No STAGING_HEALTH_URL variable defined. Skipping live health probe."
          fi

  dast-scan:
    name: OWASP ZAP Baseline DAST Scan
    needs: [deploy-development]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run OWASP ZAP Baseline Scan
        if: ${{ vars.STAGING_TARGET_URL != '' }}
        uses: zaproxy/action-baseline@41aee98ebc7cf2802c3beae4e7d4336413a21e43 # v0.9.0
        with:
          target: ${{ vars.STAGING_TARGET_URL }}
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
          fail_action: false
